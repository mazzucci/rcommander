name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked
      - run: cargo test --locked

  wasm:
    runs-on: ubuntu-latest
    env:
      TRUNK_VERSION: v0.21.14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The shared model must stay free of native-only dependencies. (Lib only: the
      # test harness doesn't build for wasm32.)
      - run: cargo clippy -p rc-core -p rc-web --target wasm32-unknown-unknown --locked
      - name: Install trunk
        run: |
          curl -sSLo trunk.tar.gz "https://github.com/trunk-rs/trunk/releases/download/$TRUNK_VERSION/trunk-x86_64-unknown-linux-musl.tar.gz"
          echo "a67f4054b249fe9acc5fabc25de1aebf19783aca3ad6ff64bf34d7da44d0ea20  trunk.tar.gz" | sha256sum -c
          tar xzf trunk.tar.gz -C ~/.cargo/bin && rm trunk.tar.gz
      - name: Build the web front end
        run: trunk build --release --locked
        working-directory: crates/rc-web
      # Release builds embed the front end; check the binary really serves it.
      - name: Release binary serves the embedded front end
        run: |
          cargo build --release -p rcmd --locked
          ./target/release/rcmd web --no-open --port 7999 > server.log 2>&1 &
          sleep 2
          curl -sf -H 'Host: 127.0.0.1:7999' http://127.0.0.1:7999/ | grep -q 'rc-web'

  claude-code-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - run: claude plugin test integrations/claude-code
