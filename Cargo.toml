[workspace]
resolver = "3"
members = ["crates/rc-core", "crates/rc-vfs"]
default-members = ["crates/rc-core", "crates/rc-vfs"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
rc-core = { path = "crates/rc-core" }
rc-vfs = { path = "crates/rc-vfs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
similar = "3"

[profile.release]
lto = "thin"
